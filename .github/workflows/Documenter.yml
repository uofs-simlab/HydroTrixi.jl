name: Documentation

on:
  push:
    branches:
      - 'main'
    tags: '*'
    paths-ignore:
      - '.zenodo.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths-ignore:
      - '.zenodo.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          show-versioninfo: true

      - uses: julia-actions/cache@v3

      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build and deploy
        uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: 100

      - name: Run doctests
        run: |
          julia --project=docs --color=yes -e '
          using Documenter: DocMeta, doctest
          using CairoMakie
          using LaTeXStrings
          using HydroTrixi

          if isnothing(Base.get_extension(HydroTrixi, :HydroTrixiVisualizationExt))
              error("HydroTrixiVisualizationExt did not load in the documentation environment.")
          end

          DocMeta.setdocmeta!(HydroTrixi,
                              :DocTestSetup,
                              :(using HydroTrixi, CairoMakie, LaTeXStrings);
                              recursive = true)
          doctest(HydroTrixi)
          '
