name: Doc Preview Cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: doc-preview-cleanup
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview and history + push changes
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          preview_dir: previews/PR${{ github.event.number }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "$DOCUMENTER_KEY" | base64 --decode > ~/.ssh/documenter
          chmod 600 ~/.ssh/documenter
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND='ssh -i ~/.ssh/documenter -o IdentitiesOnly=yes'

          if ! git clone --branch gh-pages --depth 1 \
              git@github.com:tristanmontoya/HydroTrixi.jl.git gh-pages; then
              echo "No gh-pages branch to clean."
              exit 0
          fi

          cd gh-pages

          if [ -d "${preview_dir}" ]; then
              git config user.name "Documenter.jl"
              git config user.email "documenter@juliadocs.github.io"

              git rm -rf "${preview_dir}"
              git commit -m "delete preview"
              git branch gh-pages-new $(echo "delete history" | git commit-tree HEAD^{tree})
              git push --force origin gh-pages-new:gh-pages
          fi
